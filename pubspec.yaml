name: travel_connect
description: A marketplace app connecting travelers with travel agents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Compatible versions
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.9.0
  
  # Google Sign-In - Old API version
  google_sign_in: ^6.2.0
  
  # State Management
  provider: ^6.1.0
  
  # UI & Images
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  flutter_rating_bar: ^4.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  
  # Navigation
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/